PXPP.17898.English.content=STATEMENT OF PRIVACY POLICY We are committed to protecting medical information about you. The details of our Privacy Policy (The Notice) will tell you about the ways in which we may use and disclose medical information about you. The Notice, also describes your rights and outlines obligations we have regarding the use and disclosure of medical information. We are required by law to make sure the medical information we have that identifies you is kept private. We are required by law to give you a copy of our Notice of legal duties and privacy practices. We are required by law to follow the terms of the Notice that is currently in effect. The Notice of our Privacy Policy can be obtained when you visit our office.

version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto8
  pre_build:
    commands:
      - yum update -y
      - yum install GConf2 liberation-fonts-common gtk3 libappindicator-gtk3 yum-utils libXScrnSaver redhat-lsb-core alsa-lib-devel dbus-x11 ImageMagick Xvfb net-tools -y
      - curl -O https://dl.google.com/linux/chrome/rpm/stable/x86_64/google-chrome-stable-93.0.4577.82-1.x86_64.rpm
      - ls -l /usr/bin
      - rpm -Uvh --nodeps google-chrome-stable-93.0.4577.82-1.x86_64.rpm
      - mv /usr/bin/google-chrome-stable /usr/bin/google-chrome
      - ls -l /usr/bin
      - google-chrome -version
      - which google-chrome
      - curl -O https://chromedriver.storage.googleapis.com/92.0.4515.107/chromedriver_linux64.zip
      - unzip -x -o chromedriver_linux64.zip -d /usr/bin/
      - chmod +x /usr/bin/chromedriver
  build:
    commands:
      - cd pxp-command-center-qa
      - REPLACE_STRING="${ENVIRONMENT}-"
      - testSuiteName=$(echo $APPLICATION_NAME | sed "s/$REPLACE_STRING/ /")
      - testSuiteName=`echo $testSuiteName | sed 's/ *$//g'`
      - testSuiteFileName="${testSuiteName}_test.xml"
      - |
        if [ -f "$testSuiteFileName" ]; then   
        echo "$testSuiteFileName exists";
        mvn -U clean integration-test -Dsuite.xml=${testSuiteFileName} -Dtest.environment=${ENVIRONMENT} -Dexecution.mode=headless 
        else     
        echo "$testSuiteFileName Not exists"; 
        fi
